name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on: [push, pull_request]

jobs:
  build:
    name: Build
    if: "!contains(github.event.head_commit.message, '[maven-release-plugin]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Install flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.2.10"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      # The build is orchestrated by Just. It walks the following phases:
      #   1. build-generators — Maven install of the generators module only
      #   2. generate         — run generators to emit m3.pure / m3.fbs /
      #                         m3_protocol.ttl / m3_protocol.pure into
      #                         specification/generated/
      #   3. build-bootstrap  — Maven install of the full bootstrap reactor
      #                         (parser, compiler, execution, ide, cli)
      #   4. build-cli        — copy pure-cli fat JAR to build/cli/
      #   5. build-core-pdb   — CLI: specification Pure → build/core.pdb
      #   6. build-compiler-pdb — CLI: compiler-pure Pure → build/compiler.pdb
      - name: Build (just build)
        run: just build
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

      # `just test` runs Java and Pure tests independently, aggregating status.
      # Java tests are written to a single surefire-reports-aggregate directory.
      - name: Test (just test)
        if: (github.repository != 'finos/legend-pure-next') || (github.ref != 'refs/heads/main')
        run: |
          set -e
          cd bootstrap
          mvn -B -e test -fae \
            -DargLine="-XX:MaxRAMPercentage=25.0" \
            -DforkCount=3 -DreuseForks=true \
            -Dsurefire.reports.directory=${GITHUB_WORKSPACE}/surefire-reports-aggregate \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"
          cd ..
          just test
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

      - name: Test + Sonar
        if: (github.repository == 'finos/legend-pure-next') && (github.ref == 'refs/heads/main')
        run: |
          set -e
          cd bootstrap
          mvn -B -e install javadoc:javadoc -Psonar \
            -DargLine="-XX:MaxRAMPercentage=25.0" \
            -DforkCount=3 -DreuseForks=true \
            -Dsurefire.reports.directory=${GITHUB_WORKSPACE}/surefire-reports-aggregate \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"
          cd ..
          just test
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ github.workspace }}/surefire-reports-aggregate/*.xml

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-file
          path: ${{ github.event_path }}
