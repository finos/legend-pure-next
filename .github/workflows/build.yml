# Pipeline shape:
#
#   guard                                  (no-op gate; skips release commits and the
#       │                                   duplicate same-repo `pull_request` event so
#       │                                   each commit runs once. New jobs depend on this
#       │                                   either directly or transitively via bootstrap.)
#       │
#       └── bootstrap                       (Temurin 25 — `just bootstrap::test`: mvn install with surefire +
#               │                            Pure compiler-graph spec tests, then runtime functions + PCT
#               │                            on the bootstrap CLI; produces shared/*.pdb,
#               │                            bootstrap CLI jar, and the bootstrap mvn artifacts)
#               │
#               ├── bootstrap-self-host     (Temurin 25 — `just bootstrap::spec-compiler-selfhost`: compile
#               │                            compiler-pure via Pure-on-Java and PDB-diff against Java direct)
#               ├── printer-compiled        (Temurin 25 — `just bootstrap::spec-printer-compiled`:
#               │                            parse+compile+print each compiler/tests/ file, compare to source)
#               ├── printer-protocol        (Temurin 25 — `just bootstrap::spec-printer-protocol`:
#               │                            parse+print each grammar/tests/ file, compare to source)
#               ├── truffle-self-host       (GraalVM 25 — `just truffle::test` (mvn surefire + Truffle
#               │      │                     compiler-graph spec) followed by `just truffle::spec-compiler-selfhost`
#               │      │                     — compiles compiler-pure on Truffle JVM (JIT) and PDB-diffs.
#               │      │                     Uploads platforms/truffle/build/ for downstream language jobs.)
#               │      │
#               │      ├── truffle-specifications (GraalVM 25 — every other Truffle JIT specification run
#               │      │                     for the test dashboard: functions, PCT, grammar, PDB,
#               │      │                     printers, in-memory sources; reuses the uploaded truffle jar)
#               │      │
#               │      ├── language-java     (GraalVM 25 — `just language::java::test-all`: runs
#               │      │                     meta::external::language::java tests via pure-truffle.
#               │      │                     The `compileAndExecute` native is only registered in the
#               │      │                     truffle Java extension, so this can't run on bootstrap.)
#               │      │
#               │      └── language-javascript (GraalVM 25 — same shape for the JavaScript module.)
#               │
#               └── truffle-native-self-host (GraalVM 25 — matrix of two parallel entries, each building
#                                            the native-image binary: `self-host` compiles compiler-pure
#                                            via the AOT binary and PDB-diffs against Java direct;
#                                            `specifications` runs every specification on it)
#
# bootstrap-self-host, printer-compiled, printer-protocol, truffle-self-host,
# and truffle-native-self-host all run in parallel after bootstrap finishes;
# language-java, language-javascript and truffle-specifications run in parallel after
# truffle-self-host (they need its uploaded truffle CLI jar + extension jars to invoke pure-truffle).
# All consume upstream outputs via actions/upload-artifact + actions/download-artifact.
#
# Finally, `all-green` aggregates every real job. Branch protection on main
# only needs to require this single check — adding a new parallel job means
# listing it in `all-green.needs`, no branch-protection edit required.

name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

  # Tool versions — pinned for reproducibility. Bump as a deliberate change,
  # not a side effect of an upstream release. Local equivalents:
  #   JDK_VERSION       ↔ Temurin 25 patch the team builds on (mvn `java-version`)
  #   GRAALVM_VERSION   ↔ latest graalvm-ce-builds tag for JDK 25
  #                       (`gh release list --repo graalvm/graalvm-ce-builds`).
  #                       NB: GraalVM Community lags Oracle GraalVM by one
  #                       patch; local devs on Oracle GraalVM 25.0.3 won't
  #                       match exactly, that's expected.
  #   MAVEN_VERSION     ↔ system mvn locally; we install our own here so the
  #                       runner image's preinstalled mvn can't drift the build
  #   JUST_VERSION      ↔ `just --version` locally
  JDK_VERSION: '25.0.1'
  GRAALVM_VERSION: '25.0.2'
  MAVEN_VERSION: '3.9.11'
  JUST_VERSION: '1.58.0'
  FLATC_VERSION: '25.2.10'
  #   NODE_VERSION      ↔ node on PATH locally; the JS translation runtime needs
  #                       node + pnpm to esbuild-bundle the antlr natives
  #   PNPM_VERSION      ↔ `pnpm --version` locally; major must match
  #                       pure/modules/translation/javascript/js/pnpm-lock.yaml's lockfileVersion
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

on: [push, pull_request]

# deploy-pages needs `pages: write` + `id-token: write` (OIDC). `contents: read`
# stays minimal — no other job writes back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per workflow + ref: a new push to a branch cancels that branch's
# in-flight run, while branches (and push vs pull_request refs) never queue
# behind each other. main is never cancelled, so every main commit gets a full
# run. The Pages lock lives on `publish-gallery` only — a workflow-wide lock
# serialised every run on every branch, and a cancelled run's `if: always()`
# aggregator waiting for a runner would hold it for everyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Single gate for the whole pipeline. Every top-level job depends on this
  # (directly via `needs: guard`, or transitively via `needs: bootstrap`), so
  # adding a new job just means picking the right upstream — no need to copy
  # the skip conditions onto each one.
  #
  # Skips:
  #   - `[maven-release-plugin]` commits (release machinery, not real work).
  #   - The duplicate `pull_request` event for same-repo PRs: same-repo
  #     branches already fire `push`, so we let `pull_request` run only when
  #     it comes from a fork (where `push` doesn't fire on this repo).
  guard:
    name: Pipeline guard
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
      && !contains(github.event.head_commit.message, '[maven-release-plugin]')
    steps:
      - run: echo "Pipeline authorized."

  bootstrap:
    name: Bootstrap (build + tests)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      # Builds bootstrap (mvn install + JUnit) and runs the Pure compiler-graph
      # spec tests on Pure-on-Java. Outputs shared/core.pdb, shared/compiler.pdb,
      # and the bootstrap CLI fat jar — consumed by both downstream self-host jobs.
      - name: Bootstrap test
        run: just bootstrap::test

      # Runtime functions and PCT on the bootstrap CLI, for the test dashboard (a PCT failure
      # is reported without failing the build). A few seconds on the CLI and PDBs just built.
      - name: Bootstrap runtime functions and PCT
        run: just bootstrap::spec-functions bootstrap::spec-pct

      - name: Sonar (main only)
        if: (github.repository == 'finos/legend-pure-next') && (github.ref == 'refs/heads/main')
        run: |
          set -e
          cd bootstrap/legend-pure-next-bootstrap
          mvn -B -e javadoc:javadoc -Psonar \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"

      # Pack the artifacts the downstream jobs need:
      #   shared/*.pdb        — Java-direct compiler.pdb baseline + core.pdb
      #   bootstrap/build/    — pure-bootstrap CLI fat jar (used to run the diff)
      #   ~/.m2 maven repo    — bootstrap modules installed by `mvn install`
      #                          (truffle build + diff-pdb pull these from local m2)
      # The downstream `bootstrap-self-host` job also needs the bootstrap mvn
      # artifacts to run `compile-via-pure`.
      # pdb/writer/generated/ carries generatedWriter.pure, produced by generate-writer
      # during the build above. It is gitignored, so a fresh checkout does not
      # have it — and the self-host jobs compile compiler-pure from source. Without
      # it they silently compile 193 fewer elements (every gen::write*), which
      # surfaces only as a self-host diff. Ship it with shared/ rather than making
      # each job regenerate it.
      - name: Tar bootstrap artifacts
        run: |
          tar -cf bootstrap-artifacts.tar shared/ bootstrap/build/ \
            pure/specification/compiler/compiler-pure/pdb/writer/generated/
          tar -cf bootstrap-mvn.tar -C ~/.m2/repository org/finos/legend/pure

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-artifacts
          path: |
            bootstrap-artifacts.tar
            bootstrap-mvn.tar
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bootstrap
          path: |
            ${{ github.workspace }}/bootstrap/**/target/surefire-reports/*.xml

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-bootstrap
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  bootstrap-self-host:
    name: Bootstrap self-host (compile-via-pure-on-Java vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      - name: Bootstrap self-host
        run: just bootstrap::spec-compiler-selfhost

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-bootstrap-self-host
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  printer-compiled:
    name: Printer corpus — compiled
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # parse + compile + print(ManageImports) each file in
      # pure/specification/compiler/tests/, compare normalised print to
      # source. Single compile per file. Runs in parallel with
      # printer-protocol since both only depend on the bootstrap CLI jar +
      # shared PDBs and don't touch each other's artifacts.
      - name: Compiled printer corpus
        run: just bootstrap::spec-printer-compiled

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-printer-compiled
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  printer-protocol:
    name: Printer corpus — protocol
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # parse + print each grammar.pure under pure/specification/grammar/tests/,
      # compare normalised print to source (or its grammar_compare override).
      # No compile step on this side — protocol printer works directly on
      # parsed PureFile.
      - name: Protocol printer corpus
        run: just bootstrap::spec-printer-protocol

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-printer-protocol
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  truffle-self-host:
    name: Truffle build + self-host (compile-via-pure-on-Truffle vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # GraalVM (not Temurin) is required: the Truffle interpreter needs
      # GraalVM's optimizing runtime — plain OpenJDK falls back to
      # DefaultTruffleRuntime (Interpreted), which doesn't register
      # engine.TraceCompilation and breaks the test harness's compile-failure
      # tripwire. The truffle Justfile's `_check-graalvm` enforces this.
      # We use graalvm/setup-graalvm (not actions/setup-java) because
      # setup-java's `graalvm` distribution is Oracle GraalVM only —
      # `graalvm-community` is not a recognised value there.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::test` runs the truffle reactor with surefire (Java unit
      # tests) and then the Pure compiler-graph spec suite on Truffle.
      # `truffle::spec-compiler-selfhost` then compiles compiler-pure on
      # Truffle and diffs the output against shared/compiler.pdb (Java direct).
      # `spec-compiler-selfhost` has no Maven dep — it reuses the fat jar
      # produced by `truffle::test`'s `_mvn "with-tests"` invocation.
      - name: Truffle test
        run: just truffle::test

      - name: Truffle self-host
        run: just truffle::spec-compiler-selfhost

      # Pack the truffle CLI fat jar + the Java extension jar
      # (JavaCompileNatives). Downstream language-java and language-javascript
      # jobs need these to run pure-truffle.
      - name: Tar truffle artifacts
        run: tar -cf truffle-artifacts.tar platforms/truffle/build/

      - name: Upload truffle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: truffle-artifacts
          path: truffle-artifacts.tar
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-truffle
          path: |
            ${{ github.workspace }}/platforms/truffle/**/target/surefire-reports/*.xml

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle-self-host
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  # Two parallel entries, each building the native image once:
  #   - self-host      : compile-via-pure on the AOT binary vs Java direct (below).
  #   - specifications : every specification run on the native image (compiler,
  #                      functions, PCT, grammar, PDB, printers) for the test dashboard.
  truffle-native-self-host:
    name: Truffle native (${{ matrix.suite }})
    needs: bootstrap
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # let the two entries report independently
      matrix:
        include:
          - suite: self-host
            command: just truffle::native::spec-compiler-selfhost
          - suite: specifications
            command: just truffle::native::spec
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # Same GraalVM 25 setup as truffle-self-host. `native-image` is bundled
      # in GraalVM CE since JDK 17, so just installing the JDK is enough.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::native::spec-compiler-selfhost` first builds the native-image
      # binary (~5–10 min, dominated by AOT analysis + compile), then uses it
      # to compile compiler-pure into compiler_truffle_native.pdb and PDB-diffs
      # against shared/compiler.pdb (Java direct). The Graal tripwire reports
      # `0/0` here since AOT does no runtime JIT — the value is in catching
      # AOT-specific divergence (eliminated paths, native-image substitutions)
      # that the JIT path can't surface.
      - name: Truffle native ${{ matrix.suite }}
        run: ${{ matrix.command }}

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle-native-${{ matrix.suite }}
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  # Every Truffle JIT specification run not already done by truffle-self-host (which runs the
  # compiler corpus and the self-hosted compiler): runtime functions, PCT, grammar, PDB format,
  # the PDB golden archives, both printers, and functions + PCT from in-memory sources. They
  # only need pure-truffle (the uploaded truffle jar) and the shared PDBs — no Maven — and run
  # in parallel with translation-deps. Their reports feed the test dashboard.
  truffle-specifications:
    name: Truffle specifications (JIT)
    needs: truffle-self-host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # GraalVM (not Temurin): pure-truffle requires JVMCI for real Graal JIT.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Download truffle artifacts
        uses: actions/download-artifact@v8
        with:
          name: truffle-artifacts

      - name: Restore artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          tar -xf truffle-artifacts.tar

      - name: Truffle specifications
        run: >-
          just truffle::spec-functions truffle::spec-pct truffle::spec-grammar
          truffle::spec-pdb truffle::spec-pdb-golden
          truffle::spec-printer-compiled truffle::spec-printer-protocol
          truffle::spec-functions-inmemory truffle::spec-pct-inmemory

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle-specifications
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  # Prereqs that the `translations` matrix consumes — built in parallel as one
  # matrix box so the visualizer doesn't draw long arrows around standalone
  # nodes. Three targets:
  #   - language-java       : pure-bootstrap builds pure/modules/language/java/build/java.pdb, then
  #                            pure-truffle runs `runTests meta::external::language::java`
  #                            (the Java extension's JavaCompileNatives registers
  #                            `compileAndExecute`, which bootstrap doesn't have).
  #   - language-javascript : the 133 serialization tests; these need no host
  #                            natives (the JS execution natives moved to the
  #                            standalone JS platform), so this one could run on
  #                            bootstrap — it uses pure-truffle only for speed.
  #   - translation-shared  : Pure-AST -> Pure-AST canonicalisation shared by
  #                            the two translators; `just test-all` both builds
  #                            translation-shared{,-tests}.pdb and runs the
  #                            canonical-tests suite via pure-truffle.
  # Per-entry: `build_cmd` is the optional pre-test-all build step (only the
  # language modules need a separate `just build`); `pdb_files` is the
  # space-separated tar input (shared has two files, languages have one).
  translation-deps:
    name: Translation deps (${{ matrix.target }})
    needs: truffle-self-host
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # let entries report independently
      matrix:
        include:
          - target: language-java
            working_dir: pure/modules/language/java
            build_cmd: just build
            pdb_files: pure/modules/language/java/build/java.pdb
            artifact: language-java-pdb
          - target: language-javascript
            working_dir: pure/modules/language/javascript
            build_cmd: just build
            # -tests too: test-all's split build leaves a LEAN javascript.pdb whose
            # refs point into javascript-tests.pdb, and the JS platform's emit
            # loads both.
            pdb_files: pure/modules/language/javascript/build/javascript.pdb pure/modules/language/javascript/build/javascript-tests.pdb
            artifact: language-javascript-pdb
          - target: translation-shared
            working_dir: pure/modules/translation/shared
            build_cmd: ''
            pdb_files: pure/modules/translation/shared/build/translation-shared.pdb pure/modules/translation/shared/build/translation-shared-tests.pdb
            artifact: translation-shared-pdb
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # GraalVM (not Temurin): pure-truffle requires JVMCI for real Graal JIT.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Download truffle artifacts
        uses: actions/download-artifact@v8
        with:
          name: truffle-artifacts

      - name: Restore artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository
          tar -xf truffle-artifacts.tar

      # Skip when build_cmd is empty (translation-shared's test-all already builds).
      - name: Build
        if: matrix.build_cmd != ''
        working-directory: ${{ matrix.working_dir }}
        run: ${{ matrix.build_cmd }}

      - name: Test-all
        working-directory: ${{ matrix.working_dir }}
        run: just test-all

      # Unquoted pdb_files lets bash word-split for the multi-file shared entry.
      - name: Tar pdb
        run: tar -cf ${{ matrix.artifact }}.tar ${{ matrix.pdb_files }}

      - name: Upload pdb
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar
          retention-days: 1

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-translation-deps-${{ matrix.target }}
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  # Pure -> <target> translation modules. Matrix entries:
  #   - java              : translator — `just build test-all gallery`
  #                          (translator self-tests + runtime suites + render HTML),
  #                          executed by pure-truffle. Downloads its own language pdb.
  #                          One `just` invocation, not an `&&` chain: just runs a
  #                          shared dependency (build-tests, _host-generate) once
  #                          per invocation, so a chain would rebuild it per recipe.
  #   - javascript        : translator — the same recipes, executed by the Node
  #                          host (platforms/javascript/bin/pure-js); `antlr-all`
  #                          first, because that host loads the parser bundles.
  #                          Also runs the Node platform suites (`platform_suite`:
  #                          grammar, compiler conformance, in-process PCT) —
  #                          that platform's code is generated by this module's
  #                          translator, so it is tested alongside it. Needs
  #                          Node + pnpm (the steps guarded on this target).
  #   - truffle           : backend introspection — `just gallery` only (gallery
  #                          recipe is self-building; no test-all suite exists).
  #                          No language pdb to download.
  # `language_pdb_artifact` keys the optional per-target language-pdb download;
  # empty for entries (like truffle) that don't have one. `gallery_cmd` is the
  # entry's full just-recipe sequence — different per target so the truffle box
  # doesn't pay for nonexistent test-all. Both wait for the full
  # `translation-deps` matrix to finish — coarser than per-entry edges but
  # simpler to read.
  translations:
    name: Translation ${{ matrix.target }}
    needs: translation-deps
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: java
            gallery_file: pure/modules/translation/java/build/java-translation-gallery.html
            language_pdb_artifact: language-java-pdb
            gallery_cmd: just build test-all gallery
            platform_suite: ''
          - target: javascript
            gallery_file: pure/modules/translation/javascript/build/javascript-translation-gallery.html
            language_pdb_artifact: language-javascript-pdb
            gallery_cmd: just build antlr-all test-all gallery
            platform_suite: just javascript::test-all
          - target: truffle
            gallery_file: pure/modules/translation/truffle/build/truffle-translation-gallery.html
            language_pdb_artifact: ''
            gallery_cmd: just gallery
            platform_suite: ''
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      # The javascript entry runs its suites and gallery on the Node host.
      - name: Set up Node
        if: matrix.target == 'javascript'
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        if: matrix.target == 'javascript'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Download truffle artifacts
        uses: actions/download-artifact@v8
        with:
          name: truffle-artifacts

      - name: Download translation-shared pdb
        uses: actions/download-artifact@v8
        with:
          name: translation-shared-pdb

      - name: Download language pdb
        if: matrix.language_pdb_artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.language_pdb_artifact }}

      - name: Restore artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository
          tar -xf truffle-artifacts.tar
          tar -xf translation-shared-pdb.tar
          if [[ -n "${{ matrix.language_pdb_artifact }}" ]]; then
            tar -xf ${{ matrix.language_pdb_artifact }}.tar
          fi

      - name: Translation ${{ matrix.target }}
        working-directory: pure/modules/translation/${{ matrix.target }}
        run: ${{ matrix.gallery_cmd }}

      - name: Platform suites (${{ matrix.target }})
        if: matrix.platform_suite != ''
        run: ${{ matrix.platform_suite }}

      - name: Upload translation gallery
        uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.target }}
          path: ${{ matrix.gallery_file }}
          retention-days: 1

      # Test dashboard: turn this job's JUnit XML into reports, then ship its test-results/ to
      # publish-gallery, which renders one dashboard from every job's reports.
      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results build-steps
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"
          # The heavy build steps this job ran (build-step.mjs), under a name unique to the job.
          if [[ -f test-results/builds.json ]]; then
            cp test-results/builds.json "build-steps/${{ github.job }}-${{ strategy.job-index }}.json"
          fi

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-translations-${{ matrix.target }}
          path: |
            test-results/
            !test-results/*.json
            !test-results/*.html
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload build steps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-builds-${{ github.job }}-${{ strategy.job-index }}
          path: build-steps/
          if-no-files-found: ignore
          retention-days: 1

  # Publishes the galleries and the test dashboard to GitHub Pages. The gallery HTMLs come
  # from the `translations` matrix (gallery-<target> artifacts); the dashboard is rendered
  # here from every test job's dashboard-reports-* artifact (tools/test-dashboard). All
  # files are self-contained (inline CSS/JS/data), so the deploy is "drop into _site/".
  # Runs only on push to main on the canonical repo so PRs and forks don't try to publish.
  # `!cancelled()`: it also runs when a suite failed, so the dashboard shows the failures;
  # a gallery whose job failed is left out of the site (with a warning).
  # One-time setup: repo Settings → Pages → Source = "GitHub Actions".
  publish-gallery:
    name: Publish galleries and test dashboard to GitHub Pages
    needs:
      - bootstrap
      - bootstrap-self-host
      - printer-compiled
      - printer-protocol
      - truffle-self-host
      - truffle-native-self-host
      - truffle-specifications
      - translation-deps
      - translations
    if: ${{ !cancelled() && github.repository == 'finos/legend-pure-next' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # Serialise Pages deploys so rapid main pushes don't race. `cancel-in-progress:
    # false` lets an in-flight deploy finish rather than dropping it half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The dashboard tool (tools/test-dashboard) and the commit it reports on.
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download java gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-java
          path: gallery-java

      - name: Download javascript gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-javascript
          path: gallery-javascript

      - name: Download truffle gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-truffle
          path: gallery-truffle

      - name: Download dashboard reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-reports-*
          path: test-results
          merge-multiple: true

      - name: Download build steps
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-builds-*
          path: build-steps
          merge-multiple: true

      # The published site's address, where the previous history.json and builds.json live.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _site test-results
          # History carries over from the published site: build.mjs appends this run's snapshot to
          # history.json, and each job's build steps are merged into builds.json. A 404 (first deploy)
          # starts them fresh.
          curl -fsSL "$PAGES_BASE_URL/history.json" -o test-results/history.json || rm -f test-results/history.json
          curl -fsSL "$PAGES_BASE_URL/builds.json" -o "$RUNNER_TEMP/published-builds.json" || rm -f "$RUNNER_TEMP/published-builds.json"
          node tools/test-dashboard/merge-builds.mjs test-results/builds.json "$RUNNER_TEMP/published-builds.json" build-steps/*.json
          links='    <li><a href="dashboard.html">Pure conformance dashboard</a></li>'
          publish() {
            if [[ -f "$1" ]]; then
              cp "$1" "_site/$2"
              links+=$'\n'"    <li><a href=\"$2\">$3</a></li>"
            else
              echo "::warning::$1 is missing (did its job fail?), so $2 is not published"
            fi
          }
          publish gallery-java/java-translation-gallery.html             java.html       'Pure &rarr; Java translation gallery'
          publish gallery-javascript/javascript-translation-gallery.html javascript.html 'Pure &rarr; JavaScript translation gallery'
          publish gallery-truffle/truffle-translation-gallery.html       truffle.html    'Pure &rarr; Truffle AST gallery'
          # After the galleries: --published links the PCT runs to the galleries copied next to the page.
          node tools/test-dashboard/build.mjs --no-surefire --published --out _site/dashboard.html
          # Published next to the page, for the next deploy to continue from.
          for kept in history.json builds.json; do
            if [[ -f "test-results/$kept" ]]; then cp "test-results/$kept" "_site/$kept"; fi
          done
          cat > _site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>legend-pure-next galleries and test dashboard</title>
          <h1>legend-pure-next galleries and test dashboard</h1>
          <ul>
          $links
          </ul>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Single aggregation job: branch protection only needs to require this one.
  # Adding a new parallel job means listing it in `needs:` here — no changes
  # to branch-protection settings. `if: always()` lets this run even if a
  # dependency failed, so the explicit `contains(... 'failure' / 'cancelled')`
  # check below produces a clean pass/fail (a plain skip would also block,
  # but for the wrong reason).
  all-green:
    name: All checks passed
    needs:
      - bootstrap
      - bootstrap-self-host
      - printer-compiled
      - printer-protocol
      - truffle-self-host
      - truffle-native-self-host
      - truffle-specifications
      - translation-deps
      - translations
      - publish-gallery
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all dependencies succeeded
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
