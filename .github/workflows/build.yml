# Pipeline shape (Bazel: each job runs the tests tagged job:<job>, tools/bazel/check-job-coverage.sh):
#
#   guard
#   └── bootstrap                       the bootstrap, its PDBs, the field-ID registry checks
#       ├── bootstrap-self-host         the bootstrap tests, specification suites and self-host (tagged manual):
#       │                               [pdb-golden | compiler | printer-compiled | self-host | rest], interpreted
#       ├── printer-compiled            compiler-pure printed back, on Truffle
#       ├── pdb-golden                  compiler-pure PDB goldens, on Truffle
#       ├── printer-protocol            the protocol printer corpus, on Truffle
#       ├── truffle-native              the native image: [specifications | self-host (Truffle JIT and native image)]
#       └── truffle                     Truffle: its build, JUnit tests, the compiler corpus, the usage example
#           ├── truffle-specifications  every other suite on Truffle
#           └── translation-deps        the module suites on Truffle: [language-java | language-javascript | translation-shared]
#               └── translations        the Java and JavaScript hosts, the Truffle translator:
#                                       [java | javascript | truffle | java-modules (the module suites on Java)]
#   publish-gallery → all-green
#
# Jobs hand their work on through the Bazel disk cache (.bazelrc config ci): bootstrap and truffle save
# theirs, the jobs that need them restore it, main saves the one every run starts from, and all-green deletes the run's
# own once it passes. The downloads are one repository cache, shared by every job and run (.github/actions/bazel). The manual tiers (tags
# bootstrap, selfhost) are not in //..., so not in a local `bazel test //...`, but CI runs them on every run, in
# parallel. The test dashboard reads each job's reports as before (tools/bazel/collect-reports.mjs).
name: Build CI

# Every tool version is pinned in the Bazel workspace (MODULE.bazel, tools/bazel/graalvm.bzl, .bazelversion).

on:
  push:
  pull_request:
  # A run on demand, of any branch.
  workflow_dispatch:

# deploy-pages needs `pages: write` + `id-token: write` (OIDC). `contents: read`
# stays minimal — no other job writes back to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per workflow + ref: a new push to a branch cancels that branch's
# in-flight run, while branches (and push vs pull_request refs) never queue
# behind each other. main is never cancelled, so every main commit gets a full
# run. The Pages lock lives on `publish-gallery` only — a workflow-wide lock
# serialised every run on every branch, and a cancelled run's `if: always()`
# aggregator waiting for a runner would hold it for everyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Single gate for the whole pipeline. Every top-level job depends on this
  # (directly via `needs: guard`, or transitively via `needs: bootstrap`), so
  # adding a new job just means picking the right upstream — no need to copy
  # the skip conditions onto each one.
  #
  # Skips:
  #   - `[maven-release-plugin]` commits (release machinery, not real work).
  #   - The duplicate `pull_request` event for same-repo PRs: same-repo
  #     branches already fire `push`, so we let `pull_request` run only when
  #     it comes from a fork (where `push` doesn't fire on this repo).
  guard:
    name: Pipeline guard
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'workflow_dispatch'
      || ((github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
          && !contains(github.event.head_commit.message, '[maven-release-plugin]'))
    steps:
      - run: echo "Pipeline authorized."

  bootstrap:
    name: Bootstrap (build + registry checks)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        id: bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      # The downloads of every job, saved once per key: this job fetches those it does not need itself.
      - name: Fetch every external dependency
        if: steps.bazel.outputs.repository-cache-hit != 'true'
        run: bazel fetch //...

      - name: Save the Bazel repository cache
        if: steps.bazel.outputs.repository-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.bazel.outputs.repository-cache-key }}

      - name: Check every required test belongs to one job
        run: tools/bazel/check-job-coverage.sh

      - name: Test the report tools
        run: node --test tools/bazel/compare-reports.test.mjs tools/bazel/collect-reports.test.mjs

      # What every later job builds on: the bootstrap, its PDBs, and the PDBs Truffle is built from.
      - name: Build the bootstrap outputs
        run: bazel build //bootstrap/... //pure/specification:compiler_compile //:shared //platforms/truffle/legend-pure-next-platform-truffle/legend-pure-next-platform-truffle-pure:pdb_reader

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:bootstrap //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-bootstrap
          path: test-results/
          if-no-files-found: ignore

      - name: Save the Bazel disk cache for the jobs that need this one
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ github.run_id }}-bootstrap

  bootstrap-self-host:
    name: "Bootstrap tier (${{ matrix.part }})"
    needs: bootstrap
    runs-on: ubuntu-24.04
    # Its suites are interpreted: the heaviest each on a runner of its own, the rest together.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: pdb-golden
            query: //bootstrap/modules/test:test_compiler_pdb_cli
          - part: compiler
            query: //bootstrap/modules/test:test_compiler_compiler_cli
          - part: printer-compiled
            query: //bootstrap/modules/test:test_compiler_printer-compiled_cli
          - part: self-host
            query: //bootstrap/modules/test:test_compiler_compiler_selfhost + //bootstrap/modules/pdb-check:test_compiler_pure + //bootstrap/modules/pdb-check:test_compiler_tests_pure + //bootstrap/modules/pdb-check:test_core_metamodel_pdb_writer_pure + //bootstrap/modules/pdb-check:test_island_pdb_writer_pure
          - part: rest
            query: attr(tags, "[\[ ]bootstrap[,\]]", //...) - attr(tags, "job:", //...) - //bootstrap/modules/test:test_compiler_pdb_cli - //bootstrap/modules/test:test_compiler_compiler_cli - //bootstrap/modules/test:test_compiler_printer-compiled_cli - //bootstrap/modules/test:test_compiler_compiler_selfhost - (//bootstrap/modules/pdb-check:test_compiler_pure + //bootstrap/modules/pdb-check:test_compiler_tests_pure + //bootstrap/modules/pdb-check:test_core_metamodel_pdb_writer_pure + //bootstrap/modules/pdb-check:test_island_pdb_writer_pure)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Test
        run: bazel test $(bazel query --noshow_progress '${{ matrix.query }}')

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-bootstrap-self-host-${{ matrix.part }}
          path: test-results/
          if-no-files-found: ignore

  printer-compiled:
    name: Compiled printer corpus (Truffle)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:printer-compiled //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-printer-compiled
          path: test-results/
          if-no-files-found: ignore

  pdb-golden:
    name: PDB goldens (Truffle)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:pdb-golden //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-pdb-golden
          path: test-results/
          if-no-files-found: ignore

  printer-protocol:
    name: Protocol printer corpus (Truffle)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:printer-protocol //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-printer-protocol
          path: test-results/
          if-no-files-found: ignore

  truffle:
    name: Truffle (build + JUnit + compiler corpus)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Build the Truffle CLI
        run: bazel build //platforms/truffle/legend-pure-next-platform-truffle/legend-pure-next-platform-truffle-interfaces/legend-pure-next-platform-truffle-cli:pure-truffle

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:truffle //...

      # The cache the next run on any branch starts from.
      - name: Save the Bazel disk cache for later runs
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-main-${{ github.run_id }}

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle
          path: test-results/
          if-no-files-found: ignore

      - name: Save the Bazel disk cache for the jobs that need this one
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ runner.os }}-${{ github.run_id }}-truffle

  truffle-native:
    name: Truffle native image (${{ matrix.suite }})
    needs: bootstrap
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: specifications
            command: bazel test --build_tests_only --test_tag_filters=job:truffle-native/specifications //...
          # The self-host checks of Truffle (JIT and native image): tagged manual, so not in //..., but run here on
          # every run, in parallel with the other jobs. The bootstrap's runs in bootstrap-self-host.
          - suite: self-host
            command: bazel test $(bazel query --noshow_progress 'attr(tags, "[\[ ]selfhost[,\]]", //...) - attr(tags, "[\[ ]bootstrap[,\]]", //...)')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: bootstrap

      - name: Test
        run: ${{ matrix.command }}

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle-native-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: ignore

  truffle-specifications:
    name: Truffle specifications
    needs: truffle
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: truffle

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:truffle-specifications //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-truffle-specifications
          path: test-results/
          if-no-files-found: ignore

  translation-deps:
    name: Module suites on Truffle (${{ matrix.target }})
    needs: truffle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: language-java
          - target: language-javascript
          - target: translation-shared
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: truffle

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:translation-deps/${{ matrix.target }} //...

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-translation-deps-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore

  translations:
    name: Translations (${{ matrix.target }})
    needs: translation-deps
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: java
            gallery: //platforms/java:gallery
            gallery_file: java-platform-gallery.html
          - target: javascript
            gallery: //platforms/javascript:gallery
            gallery_file: javascript-translation-gallery.html
          - target: truffle
            gallery: //platforms/truffle:gallery
            gallery_file: truffle-translation-gallery.html
          # The module suites on the Java platform, which compile and run Java as they go.
          - target: java-modules
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Bazel
        uses: ./.github/actions/bazel
        with:
          restore-from: truffle

      - name: Test
        run: bazel test --build_tests_only --test_tag_filters=job:translations/${{ matrix.target }} //...

      - name: Build the gallery
        if: matrix.gallery
        run: |
          set -euo pipefail
          bazel build ${{ matrix.gallery }}
          mkdir -p gallery
          cp "$(bazel info bazel-bin)/platforms/${{ matrix.target }}/${{ matrix.gallery_file }}" gallery/

      - name: Upload the gallery
        if: matrix.gallery
        uses: actions/upload-artifact@v7
        with:
          name: gallery-${{ matrix.target }}
          path: gallery/${{ matrix.gallery_file }}

      # The browser IDE, at its repository layout (publish-gallery copies the tree as it is).
      - name: Build the browser IDE
        if: matrix.target == 'javascript'
        run: |
          set -euo pipefail
          bazel build //platforms/javascript:ide_site
          cp -RL "$(bazel info bazel-bin)/platforms/javascript/ide-site" ide-site
          du -sh ide-site

      - name: Upload the browser IDE
        if: matrix.target == 'javascript'
        uses: actions/upload-artifact@v7
        with:
          name: ide-site
          path: ide-site

      - name: Collect dashboard reports
        if: always()
        run: |
          mkdir -p test-results
          node tools/bazel/collect-reports.mjs
          node tools/test-dashboard/build.mjs --out "$RUNNER_TEMP/dashboard.html"

      - name: Upload dashboard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-reports-translations-${{ matrix.target }}
          path: test-results/
          if-no-files-found: ignore

  publish-gallery:
    name: Publish galleries and test dashboard to GitHub Pages
    needs:
      - bootstrap
      - bootstrap-self-host
      - printer-compiled
      - pdb-golden
      - printer-protocol
      - truffle
      - truffle-native
      - truffle-specifications
      - translation-deps
      - translations
    if: ${{ !cancelled() && github.repository == 'finos/legend-pure-next' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # Serialise Pages deploys so rapid main pushes don't race. `cancel-in-progress:
    # false` lets an in-flight deploy finish rather than dropping it half-published.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The dashboard tool (tools/test-dashboard) and the commit it reports on.
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download java gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-java
          path: gallery-java

      - name: Download javascript gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-javascript
          path: gallery-javascript

      - name: Download truffle gallery
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: gallery-truffle
          path: gallery-truffle

      - name: Download the browser IDE
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ide-site
          path: ide-site

      - name: Download dashboard reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: dashboard-reports-*
          path: test-results
          merge-multiple: true

      # The published site's address, where the previous history.json and builds.json live.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _site test-results
          # History carries over from the published site: build.mjs appends this run's snapshot to
          # history.json, and builds.json (the build step times just recorded, before Bazel) is kept as
          # published. A 404 (first deploy) starts them fresh.
          curl -fsSL "$PAGES_BASE_URL/history.json" -o test-results/history.json || rm -f test-results/history.json
          curl -fsSL "$PAGES_BASE_URL/builds.json" -o "$RUNNER_TEMP/published-builds.json" || rm -f "$RUNNER_TEMP/published-builds.json"
          node tools/test-dashboard/merge-builds.mjs test-results/builds.json "$RUNNER_TEMP/published-builds.json"
          links='    <li><a href="dashboard.html">Pure conformance dashboard</a></li>'
          publish() {
            if [[ -f "$1" ]]; then
              cp "$1" "_site/$2"
              links+=$'\n'"    <li><a href=\"$2\">$3</a></li>"
            else
              echo "::warning::$1 is missing (did its job fail?), so $2 is not published"
            fi
          }
          # The IDE is a TREE, not a page: it keeps its repository layout so the page resolves
          # its .pdb archives, generated JS and Monaco exactly as it does locally. Its link
          # therefore points at the deep path rather than a copied-up index.html — copying the
          # page alone would break every relative path it uses.
          if [[ -d ide-site ]]; then
            cp -R ide-site/. _site/
            links+=$'\n'"    <li><a href=\"platforms/javascript/src/interfaces/web/index.html\">Pure IDE &mdash; compile and run Pure in the browser</a></li>"
          else
            echo "::warning::ide-site is missing (did the javascript translation job fail?), so the IDE is not published"
          fi
          publish gallery-java/java-platform-gallery.html                java.html       'Pure &rarr; Java translation gallery'
          publish gallery-javascript/javascript-translation-gallery.html javascript.html 'Pure &rarr; JavaScript translation gallery'
          publish gallery-truffle/truffle-translation-gallery.html       truffle.html    'Pure &rarr; Truffle AST gallery'
          # After the galleries: --published links the PCT runs to the galleries copied next to the page.
          node tools/test-dashboard/build.mjs --no-surefire --published --out _site/dashboard.html
          # Published next to the page, for the next deploy to continue from.
          for kept in history.json builds.json; do
            if [[ -f "test-results/$kept" ]]; then cp "test-results/$kept" "_site/$kept"; fi
          done
          cat > _site/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>legend-pure-next galleries and test dashboard</title>
          <h1>legend-pure-next galleries and test dashboard</h1>
          <ul>
          $links
          </ul>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Single aggregation job: branch protection only needs to require this one.
  # Adding a new parallel job means listing it in `needs:` here — no changes
  # to branch-protection settings. `if: always()` lets this run even if a
  # dependency failed, so the explicit `contains(... 'failure' / 'cancelled')`
  # check below produces a clean pass/fail (a plain skip would also block,
  # but for the wrong reason).
  all-green:
    name: All checks passed
    needs:
      - bootstrap
      - bootstrap-self-host
      - printer-compiled
      - pdb-golden
      - printer-protocol
      - truffle
      - truffle-native
      - truffle-specifications
      - translation-deps
      - translations
      - publish-gallery
    if: always()
    runs-on: ubuntu-24.04
    # Deleting this run's caches (the token of a pull request from a fork cannot: it keeps them, to age out).
    permissions:
      actions: write
    steps:
      - name: Verify all dependencies succeeded
        env:
          HAS_FAILURE: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$HAS_FAILURE" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."

      # A passed run needs its job-to-job disk caches no more (a failed one keeps them, for a re-run of its failed
      # jobs); on main, only this run's 'main' cache is kept, the one the next runs start from.
      - name: Delete the disk caches no later run needs
        if: github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OS: ${{ runner.os }}
          RUN: ${{ github.run_id }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          stale() {
            gh cache list --limit 100 --key "bazel-disk-$OS-$RUN-" --json key --jq '.[].key'
            if [[ "$ON_MAIN" == "true" ]]; then
              gh cache list --limit 100 --key "bazel-disk-$OS-main-" --json key --jq ".[].key | select(. != \"bazel-disk-$OS-main-$RUN\")"
            fi
          }
          stale | while read -r key; do
            echo "deleting the cache '$key'"
            gh cache delete "$key"
          done
