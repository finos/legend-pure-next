name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on: [push, pull_request]

jobs:
  build:
    name: Build
    if: "!contains(github.event.head_commit.message, '[maven-release-plugin]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Install flatc
        uses: Nugine/setup-flatc@v1
        with:
          version: "25.2.10"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      - name: Collect Workflow Telemetry
        uses: runforesight/workflow-telemetry-action@v1
        with:
          theme: dark

      # `just test` orchestrates the entire chain: it wipes build/, then runs
      # `mvn clean install` in the bootstrap reactor (gating on bootstrap unit
      # tests), generates truffle PDB wrappers, runs `mvn clean install` in
      # truffle-runtime (gating on the 800+ truffle unit tests), and finally
      # runs Pure-level spec tests on both bootstrap and truffle interpreters.
      # A failure in any phase fails the recipe — no separate `mvn test` pass.
      - name: Test (just test)
        if: (github.repository != 'finos/legend-pure-next') || (github.ref != 'refs/heads/main')
        run: just test
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

      - name: Test + Sonar
        if: (github.repository == 'finos/legend-pure-next') && (github.ref == 'refs/heads/main')
        run: |
          set -e
          just test
          cd bootstrap
          mvn -B -e javadoc:javadoc -Psonar \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"
        env:
          MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/bootstrap/**/target/surefire-reports/*.xml
            ${{ github.workspace }}/platforms/truffle/**/target/surefire-reports/*.xml

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-file
          path: ${{ github.event_path }}
