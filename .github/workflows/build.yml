# Pipeline shape:
#
#   guard                                  (no-op gate; skips release commits and the
#       │                                   duplicate same-repo `pull_request` event so
#       │                                   each commit runs once. New jobs depend on this
#       │                                   either directly or transitively via bootstrap.)
#       │
#       └── bootstrap                       (Temurin 25 — `just bootstrap::test`: mvn install with surefire +
#               │                            Pure compiler-graph spec tests; produces shared/*.pdb,
#               │                            bootstrap CLI jar, and the bootstrap mvn artifacts)
#               │
#               ├── bootstrap-self-host     (Temurin 25 — `just bootstrap::test-pure-self-host`: compile
#               │                            compiler-pure via Pure-on-Java and PDB-diff against Java direct)
#               ├── printer-compiled        (Temurin 25 — `just bootstrap::test-pure-printer-compiled`:
#               │                            parse+compile+print each compiler/tests/ file, compare to source)
#               ├── printer-protocol        (Temurin 25 — `just bootstrap::test-pure-printer-protocol`:
#               │                            parse+print each grammar/tests/ file, compare to source)
#               ├── truffle-self-host       (GraalVM 25 — `just truffle::test` (mvn surefire + Truffle
#               │      │                     compiler-graph spec) followed by `just truffle::test-pure-self-host`
#               │      │                     — compiles compiler-pure on Truffle JVM (JIT) and PDB-diffs.
#               │      │                     Uploads platforms/truffle/build/ for downstream language jobs.)
#               │      │
#               │      ├── language-java     (GraalVM 25 — `just language::java::test-all`: runs
#               │      │                     meta::external::language::java tests via pure-truffle.
#               │      │                     The `compileAndExecute` native is only registered in the
#               │      │                     truffle Java extension, so this can't run on bootstrap.)
#               │      │
#               │      └── language-typescript (GraalVM 25 — same shape for the TypeScript module.)
#               │
#               └── truffle-native-self-host (GraalVM 25 — `just truffle::native::test-pure-self-host`:
#                                            builds native-image binary, compiles compiler-pure via the
#                                            AOT binary and PDB-diffs against Java direct)
#
# bootstrap-self-host, printer-compiled, printer-protocol, truffle-self-host,
# and truffle-native-self-host all run in parallel after bootstrap finishes;
# language-java and language-typescript run in parallel after truffle-self-host
# (they need its uploaded truffle CLI jar + extension jars to invoke pure-truffle).
# All consume upstream outputs via actions/upload-artifact + actions/download-artifact.
#
# Finally, `all-green` aggregates every real job. Branch protection on main
# only needs to require this single check — adding a new parallel job means
# listing it in `all-green.needs`, no branch-protection edit required.

name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

  # Tool versions — pinned for reproducibility. Bump as a deliberate change,
  # not a side effect of an upstream release. Local equivalents:
  #   JDK_VERSION       ↔ Temurin 25 patch the team builds on (mvn `java-version`)
  #   GRAALVM_VERSION   ↔ latest graalvm-ce-builds tag for JDK 25
  #                       (`gh release list --repo graalvm/graalvm-ce-builds`).
  #                       NB: GraalVM Community lags Oracle GraalVM by one
  #                       patch; local devs on Oracle GraalVM 25.0.3 won't
  #                       match exactly, that's expected.
  #   MAVEN_VERSION     ↔ system mvn locally; we install our own here so the
  #                       runner image's preinstalled mvn can't drift the build
  #   JUST_VERSION      ↔ `just --version` locally
  JDK_VERSION: '25.0.1'
  GRAALVM_VERSION: '25.0.2'
  MAVEN_VERSION: '3.9.11'
  JUST_VERSION: '1.49.0'
  FLATC_VERSION: '25.2.10'
  #   NODE_VERSION      ↔ node on PATH locally; the TS Truffle extension needs
  #                       node + pnpm to fetch the tsc compiler (typescript.js)
  #   PNPM_VERSION      ↔ `pnpm --version` locally; major must match
  #                       platforms/typescript/pnpm-lock.yaml's lockfileVersion
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

on: [push, pull_request]

jobs:
  # Single gate for the whole pipeline. Every top-level job depends on this
  # (directly via `needs: guard`, or transitively via `needs: bootstrap`), so
  # adding a new job just means picking the right upstream — no need to copy
  # the skip conditions onto each one.
  #
  # Skips:
  #   - `[maven-release-plugin]` commits (release machinery, not real work).
  #   - The duplicate `pull_request` event for same-repo PRs: same-repo
  #     branches already fire `push`, so we let `pull_request` run only when
  #     it comes from a fork (where `push` doesn't fire on this repo).
  guard:
    name: Pipeline guard
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
      && !contains(github.event.head_commit.message, '[maven-release-plugin]')
    steps:
      - run: echo "Pipeline authorized."

  bootstrap:
    name: Bootstrap (build + tests)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      # Builds bootstrap (mvn install + JUnit) and runs the Pure compiler-graph
      # spec tests on Pure-on-Java. Outputs shared/core.pdb, shared/compiler.pdb,
      # and the bootstrap CLI fat jar — consumed by both downstream self-host jobs.
      - name: Bootstrap test
        run: just bootstrap::test

      - name: Sonar (main only)
        if: (github.repository == 'finos/legend-pure-next') && (github.ref == 'refs/heads/main')
        run: |
          set -e
          cd bootstrap/legend-pure-next-bootstrap
          mvn -B -e javadoc:javadoc -Psonar \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"

      # Pack the artifacts the downstream jobs need:
      #   shared/*.pdb        — Java-direct compiler.pdb baseline + core.pdb
      #   bootstrap/build/    — pure-bootstrap CLI fat jar (used to run the diff)
      #   ~/.m2 maven repo    — bootstrap modules installed by `mvn install`
      #                          (truffle build + diff-pdb pull these from local m2)
      # The downstream `bootstrap-self-host` job also needs the bootstrap mvn
      # artifacts to run `compile-via-pure`.
      - name: Tar bootstrap artifacts
        run: |
          tar -cf bootstrap-artifacts.tar shared/ bootstrap/build/
          tar -cf bootstrap-mvn.tar -C ~/.m2/repository org/finos/legend/pure

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-artifacts
          path: |
            bootstrap-artifacts.tar
            bootstrap-mvn.tar
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bootstrap
          path: |
            ${{ github.workspace }}/bootstrap/**/target/surefire-reports/*.xml

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  bootstrap-self-host:
    name: Bootstrap self-host (compile-via-pure-on-Java vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      - name: Bootstrap self-host
        run: just bootstrap::test-pure-self-host

  printer-compiled:
    name: Printer corpus — compiled
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # parse + compile + print(ManageImports) each file in
      # pure/specification/compiler/tests/, compare normalised print to
      # source. Single compile per file. Runs in parallel with
      # printer-protocol since both only depend on the bootstrap CLI jar +
      # shared PDBs and don't touch each other's artifacts.
      - name: Compiled printer corpus
        run: just bootstrap::test-pure-printer-compiled

  printer-protocol:
    name: Printer corpus — protocol
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # parse + print each grammar.pure under pure/specification/grammar/tests/,
      # compare normalised print to source (or its grammar_compare override).
      # No compile step on this side — protocol printer works directly on
      # parsed PureFile.
      - name: Protocol printer corpus
        run: just bootstrap::test-pure-printer-protocol

  truffle-self-host:
    name: Truffle build + self-host (compile-via-pure-on-Truffle vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # GraalVM (not Temurin) is required: the Truffle interpreter needs
      # GraalVM's optimizing runtime — plain OpenJDK falls back to
      # DefaultTruffleRuntime (Interpreted), which doesn't register
      # engine.TraceCompilation and breaks the test harness's compile-failure
      # tripwire. The truffle Justfile's `_check-graalvm` enforces this.
      # We use graalvm/setup-graalvm (not actions/setup-java) because
      # setup-java's `graalvm` distribution is Oracle GraalVM only —
      # `graalvm-community` is not a recognised value there.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      # The TypeScript Truffle extension jar bundles typescript.js (the tsc
      # compiler) as a classpath resource, copied from
      # platforms/typescript/node_modules at maven process-resources time.
      # node_modules must be populated before the reactor build below, or
      # maven-resources-plugin silently skips the missing source dir, the jar
      # ships without typescript.js, and language-typescript's compileAndExecute
      # tests fail at runtime with "typescript.js not found on classpath".
      - name: Set up Node
        uses: actions/setup-node@v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install TypeScript compiler (provides typescript.js for the TS extension jar)
        working-directory: platforms/typescript
        run: pnpm install --frozen-lockfile

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::test` runs the truffle reactor with surefire (Java unit
      # tests) and then the Pure compiler-graph spec suite on Truffle.
      # `truffle::test-pure-self-host` then compiles compiler-pure on
      # Truffle and diffs the output against shared/compiler.pdb (Java direct).
      # `test-pure-self-host` has no Maven dep — it reuses the fat jar
      # produced by `truffle::test`'s `_mvn "with-tests"` invocation.
      - name: Truffle test
        run: just truffle::test

      - name: Truffle self-host
        run: just truffle::test-pure-self-host

      # Pack the truffle CLI fat jar + extension jars (JavaCompileNatives,
      # TypeScriptCompileNatives + GraalJS runtime). Downstream language-java
      # and language-typescript jobs need these to run pure-truffle.
      - name: Tar truffle artifacts
        run: tar -cf truffle-artifacts.tar platforms/truffle/build/

      - name: Upload truffle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: truffle-artifacts
          path: truffle-artifacts.tar
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-truffle
          path: |
            ${{ github.workspace }}/platforms/truffle/**/target/surefire-reports/*.xml

  truffle-native-self-host:
    name: Truffle native build + self-host (compile-via-pure on AOT binary vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # Same GraalVM 25 setup as truffle-self-host. `native-image` is bundled
      # in GraalVM CE since JDK 17, so just installing the JDK is enough.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::native::test-pure-self-host` first builds the native-image
      # binary (~5–10 min, dominated by AOT analysis + compile), then uses it
      # to compile compiler-pure into compiler_truffle_native.pdb and PDB-diffs
      # against shared/compiler.pdb (Java direct). The Graal tripwire reports
      # `0/0` here since AOT does no runtime JIT — the value is in catching
      # AOT-specific divergence (eliminated paths, native-image substitutions)
      # that the JIT path can't surface.
      - name: Truffle native self-host
        run: just truffle::native::test-pure-self-host

  # Run the language-java module's full test suite. Depends on truffle-self-host
  # for the truffle CLI + Java extension jar (where `compileAndExecute` is
  # registered — bootstrap doesn't have it). The module's `test-all` runs
  # `runTests meta::external::language::java` via pure-truffle.
  language-java:
    name: Language Java module tests (Truffle)
    needs: truffle-self-host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # GraalVM (not Temurin): pure-truffle requires JVMCI for real Graal JIT.
      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Download truffle artifacts
        uses: actions/download-artifact@v8
        with:
          name: truffle-artifacts

      - name: Restore artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository
          tar -xf truffle-artifacts.tar

      # `build` uses pure-bootstrap to compile shared/java.pdb;
      # `test-all` runs `runTests meta::external::language::java` via pure-truffle
      # (the Java extension's JavaCompileNatives registers `compileAndExecute`).
      # No `language::*` submodule in the root Justfile — cd into the module.
      - name: Language Java test
        working-directory: pure/modules/language/java
        run: |
          just build
          just test-all

  # Run the language-typescript module's full test suite. Same shape as
  # language-java but using the TypeScript extension's GraalJS-backed
  # `compileAndExecute`.
  language-typescript:
    name: Language TypeScript module tests (Truffle)
    needs: truffle-self-host
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up GraalVM JDK
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Download truffle artifacts
        uses: actions/download-artifact@v8
        with:
          name: truffle-artifacts

      - name: Restore artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository
          tar -xf truffle-artifacts.tar

      - name: Language TypeScript test
        working-directory: pure/modules/language/typescript
        run: |
          just build
          just test-all

  # Single aggregation job: branch protection only needs to require this one.
  # Adding a new parallel job means listing it in `needs:` here — no changes
  # to branch-protection settings. `if: always()` lets this run even if a
  # dependency failed, so the explicit `contains(... 'failure' / 'cancelled')`
  # check below produces a clean pass/fail (a plain skip would also block,
  # but for the wrong reason).
  all-green:
    name: All checks passed
    needs: [bootstrap, bootstrap-self-host, printer-compiled, printer-protocol, truffle-self-host, truffle-native-self-host, language-java, language-typescript]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all dependencies succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."
