# Pipeline shape:
#
#   guard                                  (no-op gate; skips release commits and the
#       │                                   duplicate same-repo `pull_request` event so
#       │                                   each commit runs once. New jobs depend on this
#       │                                   either directly or transitively via bootstrap.)
#       │
#       └── bootstrap                       (Temurin 25 — `just bootstrap::test`: mvn install with surefire +
#               │                            Pure compiler-graph spec tests; produces shared/*.pdb,
#               │                            bootstrap CLI jar, and the bootstrap mvn artifacts)
#               │
#               ├── bootstrap-self-host     (Temurin 25 — `just bootstrap::test-pure-self-host`: compile
#               │                            compiler-pure via Pure-on-Java and PDB-diff against Java direct)
#               ├── truffle-self-host       (GraalVM 25 — `just truffle::test` (mvn surefire + Truffle
#               │                            compiler-graph spec) followed by `just truffle::test-pure-self-host`
#               │                            — compiles compiler-pure on Truffle JVM (JIT) and PDB-diffs)
#               └── truffle-native-self-host (GraalVM 25 — `just truffle::native::test-pure-self-host`:
#                                            builds native-image binary, compiles compiler-pure via the
#                                            AOT binary and PDB-diffs against Java direct)
#
# The three self-host jobs run in parallel after bootstrap finishes; all three
# consume bootstrap's outputs via actions/upload-artifact + actions/download-artifact.
# truffle-self-host and truffle-native-self-host need GraalVM; bootstrap-self-host
# uses plain Temurin.
#
# Finally, `all-green` aggregates the four real jobs. Branch protection on main
# only needs to require this single check — adding a new parallel job means
# listing it in `all-green.needs`, no branch-protection edit required.

name: Build CI

env:
  CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
  CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  MAVEN_OPTS: -XX:MaxRAMPercentage=25.0

  # Tool versions — pinned for reproducibility. Bump as a deliberate change,
  # not a side effect of an upstream release. Local equivalents:
  #   JDK_VERSION       ↔ Temurin 25 patch the team builds on (mvn `java-version`)
  #   GRAALVM_VERSION   ↔ latest graalvm-ce-builds tag for JDK 25
  #                       (`gh release list --repo graalvm/graalvm-ce-builds`).
  #                       NB: GraalVM Community lags Oracle GraalVM by one
  #                       patch; local devs on Oracle GraalVM 25.0.3 won't
  #                       match exactly, that's expected.
  #   MAVEN_VERSION     ↔ system mvn locally; we install our own here so the
  #                       runner image's preinstalled mvn can't drift the build
  #   JUST_VERSION      ↔ `just --version` locally
  JDK_VERSION: '25.0.1'
  GRAALVM_VERSION: '25.0.2'
  MAVEN_VERSION: '3.9.11'
  JUST_VERSION: '1.49.0'
  FLATC_VERSION: '25.2.10'

on: [push, pull_request]

jobs:
  # Single gate for the whole pipeline. Every top-level job depends on this
  # (directly via `needs: guard`, or transitively via `needs: bootstrap`), so
  # adding a new job just means picking the right upstream — no need to copy
  # the skip conditions onto each one.
  #
  # Skips:
  #   - `[maven-release-plugin]` commits (release machinery, not real work).
  #   - The duplicate `pull_request` event for same-repo PRs: same-repo
  #     branches already fire `push`, so we let `pull_request` run only when
  #     it comes from a fork (where `push` doesn't fire on this repo).
  guard:
    name: Pipeline guard
    runs-on: ubuntu-24.04
    if: |
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository)
      && !contains(github.event.head_commit.message, '[maven-release-plugin]')
    steps:
      - run: echo "Pipeline authorized."

  bootstrap:
    name: Bootstrap (build + tests)
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk
          server-id: central
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Configure git
        run: |
          git config --global committer.email "infra@finos.org"
          git config --global committer.name "FINOS Admin"
          git config --global author.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global author.name "${GITHUB_ACTOR}"

      # Builds bootstrap (mvn install + JUnit) and runs the Pure compiler-graph
      # spec tests on Pure-on-Java. Outputs shared/core.pdb, shared/compiler.pdb,
      # and the bootstrap CLI fat jar — consumed by both downstream self-host jobs.
      - name: Bootstrap test
        run: just bootstrap::test

      - name: Sonar (main only)
        if: (github.repository == 'finos/legend-pure-next') && (github.ref == 'refs/heads/main')
        run: |
          set -e
          cd bootstrap
          mvn -B -e javadoc:javadoc -Psonar \
            -Dorg.slf4j.simpleLogger.showDateTime=true \
            -Dorg.slf4j.simpleLogger.dateTimeFormat="yyyy-MM-dd HH:mm:ss.SSSZ"

      # Pack the artifacts the downstream jobs need:
      #   shared/*.pdb        — Java-direct compiler.pdb baseline + core.pdb
      #   bootstrap/build/    — pure-bootstrap CLI fat jar (used to run the diff)
      #   ~/.m2 maven repo    — bootstrap modules installed by `mvn install`
      #                          (truffle build + diff-pdb pull these from local m2)
      # The downstream `bootstrap-self-host` job also needs the bootstrap mvn
      # artifacts to run `compile-via-pure`.
      - name: Tar bootstrap artifacts
        run: |
          tar -cf bootstrap-artifacts.tar shared/ bootstrap/build/
          tar -cf bootstrap-mvn.tar -C ~/.m2/repository org/finos/legend/pure

      - name: Upload bootstrap artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-artifacts
          path: |
            bootstrap-artifacts.tar
            bootstrap-mvn.tar
          retention-days: 1

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bootstrap
          path: |
            ${{ github.workspace }}/bootstrap/**/target/surefire-reports/*.xml

      - name: Upload CI Event
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}

  bootstrap-self-host:
    name: Bootstrap self-host (compile-via-pure-on-Java vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          java-package: jdk

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      - name: Bootstrap self-host
        run: just bootstrap::test-pure-self-host

  truffle-self-host:
    name: Truffle build + self-host (compile-via-pure-on-Truffle vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # GraalVM (not Temurin) is required: the Truffle interpreter needs
      # GraalVM's optimizing runtime — plain OpenJDK falls back to
      # DefaultTruffleRuntime (Interpreted), which doesn't register
      # engine.TraceCompilation and breaks the test harness's compile-failure
      # tripwire. The truffle Justfile's `_check-graalvm` enforces this.
      # actions/setup-java has supported `graalvm-community` since v4; using
      # it here (vs graalvm/setup-graalvm) keeps every setup action on a
      # Node-24-native runtime, eliminating Node 20 deprecation warnings.
      - name: Set up GraalVM JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm-community'
          java-version: ${{ env.GRAALVM_VERSION }}
          java-package: jdk

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::test` runs the truffle reactor with surefire (Java unit
      # tests) and then the Pure compiler-graph spec suite on Truffle.
      # `truffle::test-pure-self-host` then compiles compiler-pure on
      # Truffle and diffs the output against shared/compiler.pdb (Java direct).
      # NB: each recipe invokes mvn separately (`_mvn "with-tests"` vs
      # `_mvn "skip-tests"`) so just dedup doesn't kick in — the second
      # mvn run is fast since deps are already cached / installed.
      - name: Truffle test
        run: just truffle::test

      # Upload surefire XMLs *before* `Truffle self-host`: the self-host
      # recipe re-invokes `_mvn "skip-tests"` which runs `mvn clean install`,
      # wiping `target/surefire-reports/` before the end-of-job upload could
      # see them. `if: always()` so test failures still produce reports.
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-truffle
          path: |
            ${{ github.workspace }}/platforms/truffle/**/target/surefire-reports/*.xml

      - name: Truffle self-host
        run: just truffle::test-pure-self-host

  truffle-native-self-host:
    name: Truffle native build + self-host (compile-via-pure on AOT binary vs Java direct)
    needs: bootstrap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-mvn-deps
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      # Same GraalVM 25 setup as truffle-self-host. `native-image` is bundled
      # in GraalVM CE since JDK 17, so just installing the JDK is enough.
      - name: Set up GraalVM JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'graalvm-community'
          java-version: ${{ env.GRAALVM_VERSION }}
          java-package: jdk

      - name: Install Maven
        run: |
          set -euo pipefail
          curl -sSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install flatc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}/Linux.flatc.binary.g++-13.zip" -o flatc.zip
          unzip -q flatc.zip
          chmod +x flatc
          sudo mv flatc /usr/local/bin/flatc
          flatc --version

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Download bootstrap artifacts
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-artifacts

      - name: Restore bootstrap artifacts
        run: |
          tar -xf bootstrap-artifacts.tar
          mkdir -p ~/.m2/repository
          tar -xf bootstrap-mvn.tar -C ~/.m2/repository

      # `truffle::native::test-pure-self-host` first builds the native-image
      # binary (~5–10 min, dominated by AOT analysis + compile), then uses it
      # to compile compiler-pure into compiler_truffle_native.pdb and PDB-diffs
      # against shared/compiler.pdb (Java direct). The Graal tripwire reports
      # `0/0` here since AOT does no runtime JIT — the value is in catching
      # AOT-specific divergence (eliminated paths, native-image substitutions)
      # that the JIT path can't surface.
      - name: Truffle native self-host
        run: just truffle::native::test-pure-self-host

  # Single aggregation job: branch protection only needs to require this one.
  # Adding a new parallel job means listing it in `needs:` here — no changes
  # to branch-protection settings. `if: always()` lets this run even if a
  # dependency failed, so the explicit `contains(... 'failure' / 'cancelled')`
  # check below produces a clean pass/fail (a plain skip would also block,
  # but for the wrong reason).
  all-green:
    name: All checks passed
    needs: [bootstrap, bootstrap-self-host, truffle-self-host, truffle-native-self-host]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all dependencies succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required checks failed or were cancelled."
            exit 1
          fi
          echo "All required checks passed."
