# The setup of a Bazel job: Node (the report tools), and the two Bazel caches, restored.
# - The repository cache (the downloads: GraalVM, the JDK, Node, the Maven jars, the npm packages) is one cache for
#   every job and run, keyed on what pins the downloads; the bootstrap job saves it when the key is new.
# - The disk cache (the action outputs) of the job this one needs: the job saves its own with actions/cache/save, when
#   a job downstream needs it, and all-green deletes the run's once the run passes (each is about a gigabyte, against
#   the repository's 10 GB of caches).
name: Bazel job
description: Restore the Bazel repository and disk caches, and set up Node and the ci configuration.
inputs:
  restore-from:
    description: The job whose disk cache to restore (this run first, then the latest of main, then of any run).
    required: true
outputs:
  repository-cache-key:
    description: The key of the repository cache.
    value: ${{ steps.repository.outputs.key }}
  repository-cache-hit:
    description: Whether the repository cache of that key was restored ('true'), so not to be saved again.
    value: ${{ steps.restore-repository.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Name the repository cache
      id: repository
      shell: bash
      run: echo "key=bazel-repo-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'maven_install.json', 'tools/bazel/*.bzl', 'platforms/javascript/pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore the Bazel repository cache
      id: restore-repository
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/bazel-repo
        key: ${{ steps.repository.outputs.key }}
        restore-keys: |
          bazel-repo-${{ runner.os }}-

    - name: Restore the Bazel disk cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/bazel-disk
        key: bazel-disk-${{ runner.os }}-${{ github.run_id }}-${{ inputs.restore-from }}
        restore-keys: |
          bazel-disk-${{ runner.os }}-${{ github.run_id }}-
          bazel-disk-${{ runner.os }}-main-
          bazel-disk-${{ runner.os }}-

    - name: Use the ci configuration
      shell: bash
      run: echo "common --config=ci" >> .bazelrc.user
