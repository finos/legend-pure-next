                            return { viewType: type, viewIndex: vi, pointIndex: pi, isExisting: true };
                        }
                    }
                    // Check line segments
                    for (let i = 0; i < fullPath.length - 1; i++) {
                        const d = pointToSegmentDist(mx, my, fullPath[i].x, fullPath[i].y, fullPath[i+1].x, fullPath[i+1].y);
                        if (d < threshold) {
                            return { viewType: type, viewIndex: vi, segmentIndex: i };
                        }
                    }
                }
            }
            return null;
        }

        // Initialize anchor offsets from stored points (like legend-studio's _offsetX/_offsetY)
        function initRelationshipOffsets(diagram) {
            const tvLookup = {};
            diagram.typeViews.forEach(tv => { tvLookup[tv.id] = tv; });
            const allViews = [
                ...diagram.generalizationViews,
                ...diagram.associationViews,
                ...diagram.propertyViews,
            ];
            for (const view of allViews) {
                const sourceTV = tvLookup[view.source];
                const targetTV = tvLookup[view.target];
                if (!sourceTV || !targetTV || !view.points || view.points.length < 2) {
                    view.sourceOffset = { x: 0, y: 0 };
                    view.targetOffset = { x: 0, y: 0 };
                    // Store only intermediate waypoints in view.path (like legend-studio)
                    view.path = (view.points && view.points.length > 2)
                        ? view.points.slice(1, -1) : [];
                    continue;
                }
                const sc = { x: sourceTV.position.x + sourceTV.width / 2, y: sourceTV.position.y + sourceTV.height / 2 };
                const tc = { x: targetTV.position.x + targetTV.width / 2, y: targetTV.position.y + targetTV.height / 2 };
                view.sourceOffset = { x: view.points[0].x - sc.x, y: view.points[0].y - sc.y };
                view.targetOffset = { x: view.points[view.points.length - 1].x - tc.x, y: view.points[view.points.length - 1].y - tc.y };
                // Store only intermediate waypoints (like legend-studio's path)
                view.path = view.points.length > 2 ? view.points.slice(1, -1) : [];
            }
        }

        // Compute anchor endpoint (like legend-studio's computeEdgeEndpoint)
        function computeEdgeEndpoint(view, tvLookup, isSource) {
            const tvId = isSource ? view.source : view.target;
            const tv = tvLookup[tvId];
            if (!tv) return { x: 0, y: 0 };
            const center = {
                x: tv.position.x + tv.width / 2,
                y: tv.position.y + tv.height / 2,
            };
            const offset = isSource ? view.sourceOffset : view.targetOffset;
            if (!offset) return center;
            const anchor = { x: center.x + offset.x, y: center.y + offset.y };
            // If anchor is inside box, use it; otherwise reset to center
            if (pointInsideBox(anchor, tv)) {
                return anchor;
            }
            // Reset offset
            if (isSource) { view.sourceOffset = { x: 0, y: 0 }; }
            else { view.targetOffset = { x: 0, y: 0 }; }
            return center;
        }

        // Build the full path for a view (like legend-studio's buildFullPath)
        function buildViewFullPath(view, tvLookup) {
            const sourceTV = tvLookup[view.source];
            const targetTV = tvLookup[view.target];
            if (!sourceTV || !targetTV) return [];
            const sourceAnchor = computeEdgeEndpoint(view, tvLookup, true);
            const targetAnchor = computeEdgeEndpoint(view, tvLookup, false);
            // Filter out intermediate waypoints inside boxes
            const path = (view.path || []).filter(p =>
                !pointInsideBox(p, sourceTV) && !pointInsideBox(p, targetTV)
            );
            return [sourceAnchor, ...path, targetAnchor];
        }

        function drawRelationshipLine(ctx, view, tvLookup, type) {
            const sourceTV = tvLookup[view.source];
            const targetTV = tvLookup[view.target];
            if (!sourceTV || !targetTV) return;

            // Compute anchors from center + offset (like legend-studio)
            const sourceAnchor = computeEdgeEndpoint(view, tvLookup, true);
            const targetAnchor = computeEdgeEndpoint(view, tvLookup, false);

            // Filter intermediates (like legend-studio's manageInsidePointsDynamically)
            const intermediatePoints = (view.path || []).filter(p =>
                !pointInsideBox(p, sourceTV) && !pointInsideBox(p, targetTV)
            );
            const fullPath = [sourceAnchor, ...intermediatePoints, targetAnchor];

            // Clip at box edges
            const n = fullPath.length;
            const sourceEdge = lineBoxIntersection(sourceAnchor, fullPath[1], sourceTV);
            const targetEdge = lineBoxIntersection(targetAnchor, fullPath[n - 2], targetTV);

            // Build edge-clipped path
            const clippedPath = [sourceEdge, ...intermediatePoints, targetEdge];

            // Draw polyline
            ctx.beginPath();
            ctx.strokeStyle = DG.lineColor;
            ctx.lineWidth = Math.max(view.lineWidth || 1, 1);
            for (let i = 0; i < clippedPath.length; i++) {
                if (i === 0) ctx.moveTo(clippedPath[i].x, clippedPath[i].y);
                else ctx.lineTo(clippedPath[i].x, clippedPath[i].y);
            }
            ctx.stroke();

            // Draw arrowhead/diamond
            if (clippedPath.length >= 2) {
                const cp = clippedPath;
                if (type === 'generalization') {
                    drawTriangleAtEdge(ctx, cp[cp.length - 2], cp[cp.length - 1], targetEdge, targetTV);
                } else if (type === 'association' || type === 'property') {
                    drawArrow(ctx, cp[cp.length - 2], targetEdge);
                    drawDiamond(ctx, cp[1], sourceEdge);
                }
            }

            // Draw waypoint handles on selected line
            if (selectedRelationship &&
                selectedRelationship.viewType === type &&
                diagramData) {
                const views = type === 'generalization' ? diagramData.generalizationViews
                    : type === 'association' ? diagramData.associationViews
                    : diagramData.propertyViews;
                if (views[selectedRelationship.viewIndex] === view) {
                    ctx.fillStyle = '#58a6ff';
                    for (const pt of intermediatePoints) {
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 4 / diagramZoom, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = 'rgba(88, 166, 255, 0.5)';
                    ctx.beginPath();
                    ctx.arc(sourceEdge.x, sourceEdge.y, 3 / diagramZoom, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(targetEdge.x, targetEdge.y, 3 / diagramZoom, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Prune points that lie inside class view boxes
        function pruneInsidePoints(path, sourceTV, targetTV) {
            if (path.length < 2) return path;
            let start = 0;
            while (start < path.length - 1 && pointInsideBox(path[start], sourceTV)) start++;
            let end = path.length - 1;
            while (end > 0 && pointInsideBox(path[end], targetTV)) end--;
            // Keep one point inside at each end for proper line direction
            start = Math.max(0, start - 1);
            end = Math.min(path.length - 1, end + 1);
            const result = path.slice(start, end + 1);
            return result.length >= 2 ? result : [path[0], path[path.length - 1]];
        }

        function pointInsideBox(p, tv) {
            return p.x >= tv.position.x && p.x <= tv.position.x + tv.width &&
                   p.y >= tv.position.y && p.y <= tv.position.y + tv.height;
        }

        // Compute intersection of line segment (from→to) with box edges
        function lineBoxIntersection(from, to, tv) {
            const bx = tv.position.x, by = tv.position.y;
            const bw = tv.width, bh = tv.height;
            const dx = to.x - from.x;
            const dy = to.y - from.y;
            if (dx === 0 && dy === 0) return to;

            let bestT = 1;
            // Left edge
            if (dx !== 0) { const t = (bx - from.x) / dx; const yy = from.y + t * dy; if (t > 0 && t <= 1 && yy >= by && yy <= by + bh && t < bestT) bestT = t; }
            // Right edge
            if (dx !== 0) { const t = (bx + bw - from.x) / dx; const yy = from.y + t * dy; if (t > 0 && t <= 1 && yy >= by && yy <= by + bh && t < bestT) bestT = t; }
            // Top edge
            if (dy !== 0) { const t = (by - from.y) / dy; const xx = from.x + t * dx; if (t > 0 && t <= 1 && xx >= bx && xx <= bx + bw && t < bestT) bestT = t; }
            // Bottom edge
            if (dy !== 0) { const t = (by + bh - from.y) / dy; const xx = from.x + t * dx; if (t > 0 && t <= 1 && xx >= bx && xx <= bx + bw && t < bestT) bestT = t; }

            return { x: from.x + bestT * dx, y: from.y + bestT * dy };
        }

        // Draw generalization triangle at box edge (matching legend-studio's drawInheritance)
        function drawTriangleAtEdge(ctx, fromPt, toPt, intersection, targetTV) {
            const startX = fromPt.x, startY = fromPt.y;
            const endX = toPt.x, endY = toPt.y;

            // Compute angle using atan (not atan2) + PI correction, matching legend-studio
            let angle = Math.atan((endY - startY) / (endX - startX));
            angle = endX >= startX ? angle : angle + Math.PI;

            const size = DG.triangleSize;
            // Triangle points relative to origin, then rotated
            const pts = [
                { x: 0, y: 0 },
                { x: -size, y: -size / 2 },
                { x: -size, y: size / 2 },
            ];

            ctx.beginPath();
            for (let i = 0; i < pts.length; i++) {
                const rx = intersection.x + (pts[i].x * Math.cos(angle) - pts[i].y * Math.sin(angle));
                const ry = intersection.y + (pts[i].x * Math.sin(angle) + pts[i].y * Math.cos(angle));
                if (i === 0) ctx.moveTo(rx, ry);
                else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.fillStyle = DG.genTriangleFill;
            ctx.fill();
            ctx.strokeStyle = DG.genTriangleStroke;
            ctx.lineWidth = 1;
            ctx.stroke();
        }


        function drawArrow(ctx, from, to) {
            const size = 8;
            const angle = Math.atan2(to.y - from.y, to.x - from.x);
            ctx.save();
            ctx.translate(to.x, to.y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-size, -size / 3);
            ctx.moveTo(0, 0);
            ctx.lineTo(-size, size / 3);
            ctx.strokeStyle = DG.lineColor;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        function drawDiamond(ctx, from, to) {
            const size = DG.diamondSize;
            const angle = Math.atan2(to.y - from.y, to.x - from.x);
            ctx.save();
            ctx.translate(to.x, to.y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-size, -size / 2);
            ctx.lineTo(-size * 2, 0);
            ctx.lineTo(-size, size / 2);
            ctx.closePath();
            ctx.fillStyle = DG.diamondFill;
            ctx.fill();
            ctx.strokeStyle = DG.diamondStroke;
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }

        // =================================================================
        // Diagram Interaction (drag, pan, zoom)
        // =================================================================
        (function() {
            const canvas = document.getElementById('diagramCanvas');
            if (!canvas) return;

            canvas.addEventListener('mousedown', (e) => {
                if (!diagramData) return;
                const { mx, my } = canvasMouseToModel(e);

                // Check if clicking on a TypeView
                for (let i = diagramData.typeViews.length - 1; i >= 0; i--) {
                    const tv = diagramData.typeViews[i];
                    if (mx >= tv.position.x && mx <= tv.position.x + tv.width &&
                        my >= tv.position.y && my <= tv.position.y + tv.height) {
                        diagramDragging = {
                            viewIndex: i,
                            startX: e.clientX,
                            startY: e.clientY,
                            origX: tv.position.x,
                            origY: tv.position.y,
                        };
                        canvas.classList.add('moving');
                        e.preventDefault();
                        return;
                    }
                }

                // Check if clicking on a relationship line
                const lineHit = findRelationshipNearPoint(mx, my, 8 / diagramZoom);
                if (lineHit) {
                    const views = lineHit.viewType === 'generalization' ? diagramData.generalizationViews
                        : lineHit.viewType === 'association' ? diagramData.associationViews
                        : diagramData.propertyViews;
                    const view = views[lineHit.viewIndex];
                    selectedRelationship = { viewType: lineHit.viewType, viewIndex: lineHit.viewIndex };

                    if (lineHit.isAnchor) {
                        // Drag edge anchor to reposition offset (like legend-studio)
                        diagramAnchorDragging = {
                            viewType: lineHit.viewType,
                            viewIndex: lineHit.viewIndex,
                            anchorEnd: lineHit.anchorEnd,
                        };
                    } else if (lineHit.isExisting) {
                        // Drag existing waypoint in view.path
                        diagramLineDragging = {
                            viewType: lineHit.viewType,
                            viewIndex: lineHit.viewIndex,
                            pointIndex: lineHit.pointIndex, // index in view.path
                        };
                    } else {
                        // Insert new waypoint into view.path
                        if (!view.path) view.path = [];
                        // segmentIndex refers to fullPath [anchor, ...path, anchor]
                        const insertIdx = lineHit.segmentIndex;
                        view.path.splice(insertIdx, 0, { x: mx, y: my });
                        diagramLineDragging = {
                            viewType: lineHit.viewType,
                            viewIndex: lineHit.viewIndex,
                            pointIndex: insertIdx,
                        };
                    }
                    canvas.classList.add('moving');
                    e.preventDefault();
                    drawDiagram();
                    return;
                }

                // Click on empty space deselects
                selectedRelationship = null;

                // Pan
                diagramPanning = {
                    startX: e.clientX,
                    startY: e.clientY,
                    origOffX: diagramOffsetX,
                    origOffY: diagramOffsetY,
                };
                canvas.classList.add('dragging');
                e.preventDefault();
                drawDiagram();
            });

            canvas.addEventListener('mousemove', (e) => {
                if (diagramDragging) {
                    const tv = diagramData.typeViews[diagramDragging.viewIndex];
                    const dx = (e.clientX - diagramDragging.startX) / diagramZoom;
                    const dy = (e.clientY - diagramDragging.startY) / diagramZoom;
                    tv.position.x = diagramDragging.origX + dx;
                    tv.position.y = diagramDragging.origY + dy;
                    // Remove intermediate waypoints that ended up inside the moved box
                    // (like legend-studio's manageInsidePointsDynamically)
                    manageInsidePointsDynamically(tv);
                    drawDiagram();
                } else if (diagramAnchorDragging) {
                    // Continuous anchor drag within box (like legend-studio)
                    const { mx, my } = canvasMouseToModel(e);
                    const views = diagramAnchorDragging.viewType === 'generalization' ? diagramData.generalizationViews
                        : diagramAnchorDragging.viewType === 'association' ? diagramData.associationViews
                        : diagramData.propertyViews;
                    const view = views[diagramAnchorDragging.viewIndex];
                    const tvLookup = {};
                    diagramData.typeViews.forEach(tv => { tvLookup[tv.id] = tv; });
                    const tvId = diagramAnchorDragging.anchorEnd === 'source' ? view.source : view.target;
                    const tv = tvLookup[tvId];
                    if (tv) {
                        const center = {
                            x: tv.position.x + tv.width / 2,
                            y: tv.position.y + tv.height / 2,
                        };
                        if (diagramAnchorDragging.anchorEnd === 'source') {
                            view.sourceOffset = { x: mx - center.x, y: my - center.y };
                        } else {
                            view.targetOffset = { x: mx - center.x, y: my - center.y };
                        }
                    }
                    drawDiagram();
                } else if (diagramLineDragging) {
                    const { mx, my } = canvasMouseToModel(e);
                    const views = diagramLineDragging.viewType === 'generalization' ? diagramData.generalizationViews
                        : diagramLineDragging.viewType === 'association' ? diagramData.associationViews
                        : diagramData.propertyViews;
                    const view = views[diagramLineDragging.viewIndex];
                    if (view.path && view.path[diagramLineDragging.pointIndex]) {
                        const tvLookup = {};
                        diagramData.typeViews.forEach(tv => { tvLookup[tv.id] = tv; });
                        const sourceTV = tvLookup[view.source];
                        const targetTV = tvLookup[view.target];
                        const dragPt = { x: mx, y: my };

                        // If dragged point enters source box → transition to anchor drag
                        if (sourceTV && pointInsideBox(dragPt, sourceTV)) {
                            const center = {
                                x: sourceTV.position.x + sourceTV.width / 2,
                                y: sourceTV.position.y + sourceTV.height / 2,
                            };
                            view.sourceOffset = { x: mx - center.x, y: my - center.y };
                            view.path.splice(diagramLineDragging.pointIndex, 1);
                            // Transition to anchor dragging (continue within box)
                            diagramAnchorDragging = {
                                viewType: diagramLineDragging.viewType,
                                viewIndex: diagramLineDragging.viewIndex,
                                anchorEnd: 'source',
                            };
                            diagramLineDragging = null;
                        }
                        // If dragged point enters target box → transition to anchor drag
                        else if (targetTV && pointInsideBox(dragPt, targetTV)) {
                            const center = {
                                x: targetTV.position.x + targetTV.width / 2,
                                y: targetTV.position.y + targetTV.height / 2,
                            };
                            view.targetOffset = { x: mx - center.x, y: my - center.y };
                            view.path.splice(diagramLineDragging.pointIndex, 1);
                            // Transition to anchor dragging (continue within box)
                            diagramAnchorDragging = {
                                viewType: diagramLineDragging.viewType,
                                viewIndex: diagramLineDragging.viewIndex,
                                anchorEnd: 'target',
                            };
                            diagramLineDragging = null;
                        }
                        // Normal drag: just update position
                        else {
                            view.path[diagramLineDragging.pointIndex].x = mx;
                            view.path[diagramLineDragging.pointIndex].y = my;
                        }
                    }
                    drawDiagram();
                } else if (diagramPanning) {
                    diagramOffsetX = diagramPanning.origOffX + (e.clientX - diagramPanning.startX);
                    diagramOffsetY = diagramPanning.origOffY + (e.clientY - diagramPanning.startY);
                    drawDiagram();
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                diagramUpdateSuppressed = true;
                try {
                    if (diagramDragging) {
                        pruneWaypointsInsideMovedBox(diagramDragging.viewIndex);
                        updateDiagramInSource();
                        diagramDragging = null;
                        canvas.classList.remove('moving');
                    } else if (diagramAnchorDragging) {
                        updateDiagramInSource();
                        diagramAnchorDragging = null;
                        canvas.classList.remove('moving');
                    } else if (diagramLineDragging) {
                        updateDiagramInSource();
                        diagramLineDragging = null;
                        canvas.classList.remove('moving');
                    } else if (diagramPanning) {
                        diagramPanning = null;
                        canvas.classList.remove('dragging');
                    }
                } finally {
                    diagramUpdateSuppressed = false;
                }
            });

            canvas.addEventListener('mouseleave', (e) => {
                diagramUpdateSuppressed = true;
                try {
                    if (diagramDragging) {
                        updateDiagramInSource();
                        diagramDragging = null;
                        canvas.classList.remove('moving');
                    }
                    if (diagramAnchorDragging) {
                        updateDiagramInSource();
                        diagramAnchorDragging = null;
                        canvas.classList.remove('moving');
                    }
                    if (diagramLineDragging) {
                        updateDiagramInSource();
                        diagramLineDragging = null;
                        canvas.classList.remove('moving');
                    }
                    if (diagramPanning) {
                        diagramPanning = null;
                        canvas.classList.remove('dragging');
                    }
                } finally {
                    diagramUpdateSuppressed = false;
                }
            });

            // Zoom with mouse wheel
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                const newZoom = Math.max(0.1, Math.min(4, diagramZoom * zoomFactor));

                // Zoom toward mouse position
                const rect = canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                diagramOffsetX = mx - (mx - diagramOffsetX) * (newZoom / diagramZoom);
                diagramOffsetY = my - (my - diagramOffsetY) * (newZoom / diagramZoom);
                diagramZoom = newZoom;
                drawDiagram();
            }, { passive: false });
        })();

        function canvasMouseToModel(e) {
            const canvas = document.getElementById('diagramCanvas');
            const rect = canvas.getBoundingClientRect();
            const cx = e.clientX - rect.left;
            const cy = e.clientY - rect.top;
            return {
                mx: (cx - diagramOffsetX) / diagramZoom,
                my: (cy - diagramOffsetY) / diagramZoom,
            };
        }

        // Remove intermediate waypoints inside a class box (like legend-studio's manageInsidePointsDynamically)
        // When a dot is consumed, update the offset so the anchor moves to where the dot was
        function manageInsidePointsDynamically(tv) {
            if (!diagramData) return;
            const center = {
                x: tv.position.x + tv.width / 2,
                y: tv.position.y + tv.height / 2,
            };
            const allViews = [
                ...diagramData.generalizationViews,
                ...diagramData.associationViews,
                ...diagramData.propertyViews,
            ];
            for (const view of allViews) {
                if (view.source !== tv.id && view.target !== tv.id) continue;
                if (!view.path) view.path = [];
                const consumed = view.path.filter(p => pointInsideBox(p, tv));
                if (consumed.length > 0) {
                    // Use consumed point as new anchor offset
                    const pick = view.source === tv.id ? consumed[0] : consumed[consumed.length - 1];
                    const offset = { x: pick.x - center.x, y: pick.y - center.y };
                    if (view.source === tv.id) {
                        view.sourceOffset = offset;
                    } else {
                        view.targetOffset = offset;
                    }
                    view.path = view.path.filter(p => !pointInsideBox(p, tv));
                }
            }
        }

        // After dragging a box, prune waypoints that ended up inside the moved box
        function pruneWaypointsInsideMovedBox(viewIndex) {
            if (!diagramData) return;
            const tv = diagramData.typeViews[viewIndex];
            const tvLookup = {};
            diagramData.typeViews.forEach(t => { tvLookup[t.id] = t; });

            const allViews = [
                ...diagramData.generalizationViews,
                ...diagramData.associationViews,
                ...diagramData.propertyViews,
            ];

            for (const view of allViews) {
                if (view.source !== tv.id && view.target !== tv.id) continue;
                rebuildViewPoints(view, tvLookup);
            }
            drawDiagram();
        }

        // Rebuild view.points from current offsets and path (for serialization)
        function rebuildViewPoints(view, tvLookup) {
            const sourceAnchor = computeEdgeEndpoint(view, tvLookup, true);
            const targetAnchor = computeEdgeEndpoint(view, tvLookup, false);
            view.points = [sourceAnchor, ...(view.path || []), targetAnchor];
        }

        let diagramUpdateSuppressed = false;
        let diagramUpdateTimer = null;

        // Hook into editor changes to update diagram
        function setupDiagramSync() {
            if (!editor) return;
            editor.onDidChangeModelContent(() => {
                if (diagramUpdateSuppressed) return;
                if (currentEditorTab === 'diagram') {
                    clearTimeout(diagramUpdateTimer);
                    diagramUpdateTimer = setTimeout(updateDiagram, 300);
                }
            });
        }

        // Zoom controls
        function diagramZoomIn() {
            diagramZoom = Math.min(4, diagramZoom * 1.2);
            drawDiagram();
        }
        function diagramZoomOut() {
            diagramZoom = Math.max(0.1, diagramZoom / 1.2);
            drawDiagram();
        }
        function diagramFitToScreen() {
            if (!diagramData || diagramData.typeViews.length === 0) return;
            const canvas = document.getElementById('diagramCanvas');
            const dpr = window.devicePixelRatio || 1;
            const cw = canvas.width / dpr;
            const ch = canvas.height / dpr;

            // Compute bounding box of all type views
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            diagramData.typeViews.forEach(tv => {
                minX = Math.min(minX, tv.position.x);
                minY = Math.min(minY, tv.position.y);
                maxX = Math.max(maxX, tv.position.x + tv.width);
                maxY = Math.max(maxY, tv.position.y + tv.height);
            });

            const padding = 40;
            const dw = maxX - minX + padding * 2;
            const dh = maxY - minY + padding * 2;
            diagramZoom = Math.min(cw / dw, ch / dh, 2);
            diagramOffsetX = (cw - dw * diagramZoom) / 2 - (minX - padding) * diagramZoom;
            diagramOffsetY = (ch - dh * diagramZoom) / 2 - (minY - padding) * diagramZoom;
            drawDiagram();
        }

        // ResizeObserver for diagram resizing
        const diagramResizeObserver = new ResizeObserver(() => {
            if (currentEditorTab === 'diagram') updateDiagram();
        });
        const diagPanel = document.getElementById('diagramPanel');
        if (diagPanel) diagramResizeObserver.observe(diagPanel);
    </script>
</body>
